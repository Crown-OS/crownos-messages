[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Crown-OS/crownos-messages"
publish = false

[workspace.dependencies]
crownos-messages-core = { path = "crates/core" }

jiff = "0.2"
percent-encoding = "2.3"
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
